<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Salud | ATLAS SO</title>

    <link rel="stylesheet" href="styles.css">
    <script src="health.js" defer></script>
</head>

<body>
    <main class="dashboard">
        <header class="page-header">
            <a class="back-link" href="index.html">
                ← Volver al panel
            </a>

            <span class="brand">ATLAS SO</span>

            <h1>Salud</h1>

            <p class="page-description">
                Registrá tus hábitos diarios y medí tu progreso.
            </p>
        </header>

        <section class="health-summary">
            <article class="health-summary-card">
                <span>Último peso</span>
                <strong id="latestWeight">Sin datos</strong>
            </article>

            <article class="health-summary-card">
                <span>Promedio de sueño</span>
                <strong id="averageSleep">Sin datos</strong>
            </article>

            <article class="health-summary-card">
                <span>Entrenamientos recientes</span>
                <strong id="recentWorkouts">0 de 7</strong>
            </article>

            <article class="health-summary-card">
                <span>Último registro de agua</span>
                <strong id="latestWater">Sin datos</strong>
            </article>
        </section>

        <section class="status-card health-form-card">
            <h2>Registro diario</h2>

            <form id="healthForm" class="health-form">
                <input
                    id="healthDate"
                    type="date"
                    required
                >

                <input
                    id="healthWeight"
                    type="number"
                    min="30"
                    max="300"
                    step="0.1"
                    placeholder="Peso en kg"
                    required
                >

                <input
                    id="sleepHours"
                    type="number"
                    min="0"
                    max="24"
                    step="0.5"
                    placeholder="Horas de sueño"
                    required
                >

                <input
                    id="waterLiters"
                    type="number"
                    min="0"
                    max="15"
                    step="0.1"
                    placeholder="Agua en litros"
                    required
                >

                <select
                    id="workoutCompleted"
                    aria-label="Entrenamiento"
                >
                    <option value="false">
                        No entrené
                    </option>

                    <option value="true">
                        Entrené
                    </option>
                </select>

                <button
                    class="primary-button"
                    type="submit"
                >
                    Guardar
                </button>
            </form>
        </section>

        <section class="status-card health-history-card">
            <div class="section-heading">
                <h2>Historial</h2>

                <p>
                    Si registrás nuevamente una fecha,
                    se actualizará ese día.
                </p>
            </div>

            <ul id="healthRecordList"></ul>
        </section>
    </main>
</body>
</html>
