<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <title>Nueva contraseña | ATLAS SO</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/atlas-192.png">
    <link rel="stylesheet" href="auth.css">
    <script src="vendor/supabase.js"></script>
    <script src="atlas-config.js"></script>
    <script src="auth-core.js"></script>
    <script src="auth-page.js?v=0.5.0" defer></script>
</head>
<body data-auth-page="reset">
    <main class="auth-layout reset-layout">
        <section class="auth-story">
            <a class="auth-brand" href="login.html"><span class="auth-brand-mark">A</span><span><strong>ATLAS SO</strong><small>Sistema operativo personal</small></span></a>
            <div class="auth-story-copy">
                <p class="auth-eyebrow">RECUPERACIÓN DE CUENTA</p>
                <h1>Una llave nueva.<br>El mismo sistema.</h1>
                <p>Elegí una contraseña que no utilices en otros servicios.</p>
            </div>
            <p class="auth-motto">Seguridad primero. El apuro sale caro.</p>
        </section>
        <section class="auth-panel">
            <div class="auth-card">
                <header class="auth-heading">
                    <p class="auth-eyebrow">ÚLTIMO PASO</p>
                    <h2>Creá una nueva contraseña</h2>
                    <p>Debe tener al menos 8 caracteres.</p>
                </header>
                <form id="resetForm" class="auth-form">
                    <label>
                        <span>Nueva contraseña</span>
                        <div class="password-field">
                            <input id="resetPassword" type="password" autocomplete="new-password" minlength="8" required>
                            <button data-toggle-password="resetPassword" type="button">Ver</button>
                        </div>
                    </label>
                    <label>
                        <span>Repetir contraseña</span>
                        <input id="resetPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required>
                    </label>
                    <button class="auth-primary" type="submit">Guardar nueva contraseña</button>
                </form>
                <div id="authMessage" class="auth-message" role="status" aria-live="polite"></div>
            </div>
        </section>
    </main>
</body>
</html>
